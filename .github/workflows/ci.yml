name: GiveChain CI — Midnight ZK dApp

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: "🧪 Run Contract & Frontend Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # ─── TypeScript Type Check ──────────────────────────────────────────────────
  typecheck:
    name: "🔷 TypeScript Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check TypeScript types
        run: npm run build

  # ─── Lint / Code Quality ────────────────────────────────────────────────────
  lint:
    name: "🔍 Code Quality Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Verify contract files exist
        run: |
          test -f contracts/charity_donation.compact && echo "✅ charity_donation.compact found"
          test -f contracts/hello-world.compact && echo "✅ hello-world.compact found"
      - name: Verify test files exist
        run: |
          test -f tests/charity_donation.test.ts && echo "✅ Test file found"
      - name: Verify CI/CD configuration
        run: |
          test -f .github/workflows/ci.yml && echo "✅ CI pipeline configured"
          test -f PROPOSAL.md && echo "✅ Proposal document found"
          test -f README.md && echo "✅ README found"

  # ─── Frontend Build ─────────────────────────────────────────────────────────
  build:
    name: "📦 Vite Production Build"
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build production bundle
        run: npm run build:web
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint, build]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "## GiveChain CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔷 TypeCheck | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contract:** \`contracts/charity_donation.compact\`" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Midnight Preprod Testnet" >> $GITHUB_STEP_SUMMARY
          echo "**Contract Address:** \`020050ae5b37df2195f19069509df6ebcd9e3f60046b0a6ec9ea8c85ae0ff33e9d\`" >> $GITHUB_STEP_SUMMARY
